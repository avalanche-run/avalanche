[project]
name = "avalanche-ai"
version = "0.20.36"
description = "Python toolkit for local-first data workflows"
authors = [{ name = "Gabriel Lesperance", email = "611342+glesperance@users.noreply.github.com" }]
requires-python = ">=3.13,<3.14"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "cloudpickle>=3.1,<4",
    "croniter>=6.2.2",
    "fastapi>=0.115,<1",
    "grpcio>=1.85.1",
    "httpx>=0.27,<1",
    "protobuf>=6.31.1",
    "pydantic>=2,<3",
    "python-dotenv>=1.0",
    "python-ulid>=3.0.0",
    "pyyaml>=6",
    "textual>=6.2.1",
    "uvicorn>=0.30,<1",
    "watchfiles>=1.1.1",
]

[project.scripts]
ava = "ava_cli:main"
avalanche-ai = "ava_cli:main"

[project.optional-dependencies]
typesafe = [
    "typesafe-sdk>=0.6.0",
]
integrations = [
    "mcp>=2.3,<3",
    "authlib>=1.6,<2",
]
agents = [
    "predict-rlm[codex-lm]>=0.13.3,<0.14",
]
dataframes = [
    "polars>=1.34,<1.35",
    "dataframely>=1.13.0,<2",
    "pyarrow>=24",
]
claude = [
    "avalanche-ai[agents]",
    "claude-agent-sdk>=0.2.174",
]
openai = [
    "avalanche-ai[agents]",
    "openai-agents>=0.24.0",
    # Decisions with JSON input and question parts (ava.classifiers.OpenAIDecisions).
    "openai>=3.37.0",
]
gemini = [
    "google-genai>=3.2.0",
]

[dependency-groups]
dev = [
    "boto3>=1.35,<2",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.5.6,<0.6",
    "croniter>=6.2.2",
    "flask>=3,<4",
    "grpcio>=1.85.1",
    "grpcio-tools>=1.75.1",
    "moto[s3,server]>=5,<6",
    "s3fs>=2026.6.0,<2027",
    "pytest-cov>=7.0.0",
    "textual>=6.2.1",
    "watchfiles>=1.1.1",
    "predict-rlm>=0.13.3,<0.14",
    "marimo>=0.23.9,<0.24",
    "pre-commit>=4,<5",
    "pytest-xdist>=3.6,<4",
]
examples = [
    "openpyxl>=3.1,<4",
]

[tool.avalanche]
flow_targets = ["examples/operator_workflow.py"]

[tool.uv]
# DSPy still declares litellm on Python < 3.15; Avalanche and PredictRLM call
# models through DSPy's native engines, so keep litellm out of resolution.
exclude-dependencies = ["litellm"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = ["test"]
asyncio_mode = "strict"
markers = [
    "tmux: tests that require a tmux session (real terminal rendering)",
    "serial: misses its deadline under parallel load; the gate runs these after the parallel pass",
]

[tool.ruff]
lint.select = ["E", "F", "W", "I", "N"]
line-length = 96

[tool.ruff.lint.isort]
known-first-party = ["avalanche", "ava_cli", "runtime", "tui"]

[tool.ruff.lint.per-file-ignores]
# Generated by protoc; preserve generated import layout and gRPC method names.
"src/runtime/operator/proto/operator_pb2*.py" = ["E501", "F401", "F541", "I001", "N802"]
"src/runtime/operator/proto/operator_pb2*.pyi" = ["E501", "I001"]

[tool.coverage.run]
source = ["src/avalanche"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.sdist]
include = ["src/avalanche", "src/ava_cli", "src/runtime", "src/tui"]

[tool.hatch.build.targets.wheel]
include = ["src/avalanche", "src/ava_cli", "src/runtime", "src/tui"]

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
"init.sh" = "ava_cli/init.sh"
"skills/avalanche" = "ava_cli/skills/avalanche"

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"
"init.sh" = "init.sh"
"skills/avalanche" = "skills/avalanche"

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
